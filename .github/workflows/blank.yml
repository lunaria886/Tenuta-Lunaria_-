name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v6

      - name: Configura Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Installa dipendenze
        run: npm install

      - name: Aggiungi Android
        run: npx cap add android

      - name: Aggiungi permesso microfono
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml

      - name: Configura Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Configura WebView per microfono
        run: |
          mkdir -p android/app/src/main/java/it/tenutalunaria/app

          cat > android/app/src/main/java/it/tenutalunaria/app/MainActivity.java <<'EOF'
          package it.tenutalunaria.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getBridge().getWebView().setWebChromeClient(
                      new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(
                                  final PermissionRequest request) {

                              runOnUiThread(() -> {

                                  String[] resources = request.getResources();

                                  if (resources == null) {
                                      request.deny();
                                      return;
                                  }

                                  for (String resource : resources) {

                                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {

                                          if (checkSelfPermission(
                                                  Manifest.permission.RECORD_AUDIO
                                              ) == PackageManager.PERMISSION_GRANTED) {

                                              request.grant(new String[]{
                                                  PermissionRequest.RESOURCE_AUDIO_CAPTURE
                                              });

                                          } else {
                                              request.deny();
                                          }

                                          return;
                                      }
                                  }

                                  request.deny();
                              });
                          }
                      }
                  );
              }
          }
          EOF

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: Compila APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
