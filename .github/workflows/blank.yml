name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v6

      - name: Configura Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

            - name: Installa dipendenze
        run: npm install

      - name: Aggiungi Android
        run: npx cap add android

      - name: Aggiungi permesso microfono
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: Configura Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Compila APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
